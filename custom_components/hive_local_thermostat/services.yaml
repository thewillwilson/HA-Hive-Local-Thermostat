boost_heating:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
    minutes_to_boost:
      name: Minutes
      description: Number of minutes to boost (or use default if omitted).
      required: false
      selector:
        number:
          min: 15
          max: 180
          mode: box
    temperature_to_boost:
      name: Temperature
      description: Target temperature to boost to (or use default if omitted).
      required: false
      selector:
        number:
          min: 5
          max: 32
          step: 0.5
          mode: box
cancel_boost_heating:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
boost_water:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
    minutes_to_boost:
      name: Minutes
      description: Number of minutes to boost (or use default if omitted).
      required: false
      selector:
        number:
          min: 15
          max: 180
          mode: box
cancel_boost_water:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
get_weekly_schedule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
    zone:
      name: Zone
      description: Which zone's schedule to request (water is SLR2 only).
      required: false
      selector:
        select:
          options:
            - heat
            - water
set_weekly_schedule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hive_local_thermostat
    zone:
      name: Zone
      description: Which zone's schedule to write (water is SLR2 only).
      required: false
      selector:
        select:
          options:
            - heat
            - water
    days:
      name: Days
      description: Day(s) this programme applies to (they'll share the same transitions).
      required: true
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    transitions:
      name: Transitions
      description: >-
        List of transition objects, up to 6, in chronological order. Each is
        {time: "HH:MM", ...}. For heat use temperature: <°C> for a real target,
        or state: "off" for a setback period. For water use state: "on" or
        state: "off". This matches what the weekly schedule sensor renders, so
        a day read back via get_weekly_schedule can be pasted straight in here.
      required: true
      selector:
        object: {}
